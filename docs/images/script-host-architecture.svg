<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1f2328">
  <title>Script host architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="860" height="490" fill="#ffffff"/>

  <!-- client and server -->
  <rect x="300" y="16" width="260" height="44" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="430" y="43" text-anchor="middle" font-weight="600">MCP client (Claude, any agent)</text>
  <line x1="430" y1="60" x2="430" y2="84" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="86" width="500" height="62" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="430" y="110" text-anchor="middle" font-weight="600">Python MCP server (python/)</text>
  <text x="430" y="130" text-anchor="middle" font-size="12">eplan_script_* (run, hello, status, cancel, list, offline_stop, host_install)</text>
  <text x="430" y="144" text-anchor="middle" font-size="11" fill="#57606a">write gate · runtime selector · run folders · library scripts as tools</text>

  <line x1="330" y1="148" x2="150" y2="186" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="148" x2="430" y2="186" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="148" x2="710" y2="186" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- three runtimes -->
  <rect x="30" y="188" width="240" height="160" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="150" y="212" text-anchor="middle" font-weight="600">Add-in</text>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#57606a">EplanMcp_RunScript action, Remote Client</text>
  <text x="46" y="258">EPLAN running: yes</text>
  <text x="46" y="278">Add-in registered: yes</text>
  <text x="62" y="294" font-size="11" fill="#57606a">(EplApiModuleActionNet)</text>
  <text x="46" y="316">Project: open</text>

  <rect x="310" y="188" width="240" height="160" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="430" y="212" text-anchor="middle" font-weight="600">Bootstrap</text>
  <text x="430" y="230" text-anchor="middle" font-size="11" fill="#57606a">ExecuteScript loads the host from bytes</text>
  <text x="326" y="258">EPLAN running: yes</text>
  <text x="326" y="278">Add-in registered: no</text>
  <text x="342" y="294" font-size="11" fill="#57606a">(no registration, no restart)</text>
  <text x="326" y="316">Project: open</text>

  <rect x="590" y="188" width="240" height="160" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="710" y="212" text-anchor="middle" font-weight="600">Offline host</text>
  <text x="710" y="230" text-anchor="middle" font-size="11" fill="#57606a">separate process, EPLAN offline API</text>
  <text x="606" y="258">EPLAN window: none</text>
  <text x="606" y="278">Add-in registered: no</text>
  <text x="606" y="298">Project: closed (.elk path)</text>
  <text x="606" y="316">Script: @needs offline | either</text>

  <text x="430" y="476" text-anchor="middle" font-size="12" fill="#57606a">All three need the EPLAN API developer license and run the same scripts.</text>

  <line x1="150" y1="348" x2="330" y2="398" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="348" x2="430" y2="398" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="710" y1="348" x2="530" y2="398" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="230" y="400" width="400" height="52" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="430" y="422" text-anchor="middle" font-weight="600">EPLAN API (*Netu, .NET 8)</text>
  <text x="430" y="440" text-anchor="middle" font-size="12">compiled with EPLAN's own Roslyn</text>
</svg>
