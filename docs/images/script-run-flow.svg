<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1f2328">
  <title>One script run</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="230" fill="#ffffff"/>

  <g text-anchor="middle">
    <rect x="12" y="40" width="110" height="70" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <text x="67" y="68" font-weight="600">1 Header</text>
    <text x="67" y="88" font-size="11" fill="#57606a">@tool @arg @writes</text>
    <text x="67" y="102" font-size="11" fill="#57606a">@needs</text>

    <rect x="139" y="40" width="110" height="70" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="194" y="68" font-weight="600">2 Compile</text>
    <text x="194" y="88" font-size="11" fill="#57606a">EPLAN's Roslyn</text>
    <text x="194" y="102" font-size="11" fill="#57606a">your line numbers</text>

    <rect x="266" y="40" width="110" height="70" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="321" y="68" font-weight="600">3 Safety</text>
    <text x="321" y="88" font-size="11" fill="#57606a">EMCP001-005</text>
    <text x="321" y="102" font-size="11" fill="#57606a">compile time</text>

    <rect x="393" y="40" width="110" height="70" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="448" y="68" font-weight="600">4 Write gate</text>
    <text x="448" y="88" font-size="11" fill="#57606a">scratch clone or</text>
    <text x="448" y="102" font-size="11" fill="#57606a">approved real write</text>

    <rect x="520" y="40" width="110" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="575" y="68" font-weight="600">5 Run</text>
    <text x="575" y="88" font-size="11" fill="#57606a">collectible context</text>
    <text x="575" y="102" font-size="11" fill="#57606a">Budget.Check()</text>

    <rect x="647" y="40" width="110" height="70" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <text x="702" y="68" font-weight="600">6 Result</text>
    <text x="702" y="88" font-size="11" fill="#57606a">JSON + log</text>
    <text x="702" y="102" font-size="11" fill="#57606a">audit record</text>

    <rect x="774" y="40" width="110" height="70" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <text x="829" y="68" font-weight="600">7 Unload</text>
    <text x="829" y="88" font-size="11" fill="#57606a">best effort</text>
    <text x="829" y="102" font-size="11" fill="#57606a">no restart</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="122" y1="75" x2="137" y2="75"/>
    <line x1="249" y1="75" x2="264" y2="75"/>
    <line x1="376" y1="75" x2="391" y2="75"/>
    <line x1="503" y1="75" x2="518" y2="75"/>
    <line x1="630" y1="75" x2="645" y2="75"/>
    <line x1="757" y1="75" x2="772" y2="75"/>
  </g>

  <!-- failure exits -->
  <g stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M194,110 V150 H448"/>
    <path d="M321,110 V150"/>
    <path d="M448,110 V150"/>
    <path d="M575,110 V150 H448"/>
  </g>
  <rect x="318" y="152" width="260" height="56" rx="8" fill="#ffffff" stroke="#cf222e"/>
  <text x="448" y="174" text-anchor="middle" font-weight="600" fill="#cf222e">Stops: success false</text>
  <text x="448" y="194" text-anchor="middle" font-size="11" fill="#57606a">diagnostics, refusal, or runtime error with line</text>
  <text x="12" y="24" font-size="12" fill="#57606a">compile_only=True checks without running and returns the confirm_code. A long run returns a run_id.</text>
</svg>
