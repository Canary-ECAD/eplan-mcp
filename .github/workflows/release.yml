# A tag vX.Y.Z publishes a release: tools.json attached, and notes listing the tools added,
# removed or re-annotated since the previous tag (tools/release_notes.py). Clients that pin
# eplan-mcp (Bochica) read those notes before bumping.
#
#   git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install
        run: python -m pip install -r python/mcp_server/requirements.txt pytest
      - name: Tests
        working-directory: python
        run: python -m pytest -q -m "not live"
      - name: tools.json is up to date
        run: python python/tools/dump_tools.py --check
      - name: Notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            # Tags before the folder rename keep tools.json under the old folder.
            git show "$previous:python/tools.json" > previous-tools.json 2>/dev/null \
              || git show "$previous:eplan-p8-mcp-server/tools.json" > previous-tools.json 2>/dev/null \
              || true
          fi
          python python/tools/release_notes.py previous-tools.json python/tools.json > notes.md
          if [ -n "$previous" ]; then
            echo "" >> notes.md
            echo "Full diff: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" python/tools.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
