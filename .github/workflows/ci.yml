name: ci

# Tier 1 of the CI plan: everything that does NOT need EPLAN. EPLAN's API assemblies are
# proprietary and absent on hosted runners, so the EPLAN-bound projects (EplanMcp.Scripting,
# EplanMcp.Host.AddIn, the script compile check) are built and live-tested on a machine with
# EPLAN instead (see dotnet/tests/live/README.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
          dotnet-version: 8.0.x
      - name: Test the EPLAN-free projects
        run: dotnet test dotnet/EplanMcp.NoEplan.slnf -c Release

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r python/mcp_server/requirements.txt pytest
      - name: Offline tests
        working-directory: python
        run: python -m pytest tests -q -m "not live"
