# The offline test suite and the tool contract, on every push to main and every PR. Tests that
# need a running EPLAN (marker `live`) skip themselves; they are excluded here to be explicit.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install
        run: python -m pip install -r mcp_server/requirements.txt pytest
      - name: Tests
        run: python -m pytest -q -m "not live"
      - name: tools.json is up to date
        run: python tools/dump_tools.py --check
